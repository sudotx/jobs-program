[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
freelance_escrow = "C8GtLx57Yw2ye31GWEKREdM3s12mJhpgjWzj1j1srCAg"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test.validator]
rpc_port = 8898
faucet_port = 9901
bind_address = "127.0.0.1"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
